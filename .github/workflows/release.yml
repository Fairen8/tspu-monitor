name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Тег релиза (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ------------------------------------------------------------------
  # 1. Python-артефакты: sdist + wheel + контрольные суммы
  # ------------------------------------------------------------------
  build-python:
    name: "Python packages"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Сборка sdist и wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Артефакты
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          retention-days: 30

  # ------------------------------------------------------------------
  # 2. GitHub Release с вложениями
  # ------------------------------------------------------------------
  github-release:
    name: "GitHub Release"
    needs: build-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            Артефакты: wheel и sdist, контрольные суммы — SHA256SUMS.
            Docker-образ: `ghcr.io/fairen8/tspu-monitor:${{ env.RELEASE_TAG }}`.
            История изменений: CHANGELOG.md.

  # ------------------------------------------------------------------
  # 3. Docker-образ в GHCR
  # ------------------------------------------------------------------
  publish-image:
    name: "Docker image (GHCR)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Определить версии
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      - name: Вход в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
