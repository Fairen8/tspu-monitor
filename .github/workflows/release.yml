name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Тег релиза (vX.Y.Z, допускается суффикс -rc.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего релиза (vX.Y.Z) — пересборка артефактов"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ------------------------------------------------------------------
  # 1. Python-артефакты и заметки из CHANGELOG
  # ------------------------------------------------------------------
  build-python:
    name: "Python packages"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Версия и тип релиза
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Сборка sdist и wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: DEB-пакет и переносимый zipapp
        run: |
          bash scripts/build-deb.sh "${{ steps.version.outputs.value }}" dist
          bash scripts/build-archive.sh "${{ steps.version.outputs.value }}" dist

      - name: Контрольные суммы
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Заметки из CHANGELOG
        run: |
          python scripts/changelog_section.py "${{ steps.version.outputs.value }}" \
            --output release-notes.md \
            --fallback "История изменений — в CHANGELOG.md."
          printf '\n---\n\n' >> release-notes.md
          cat scripts/release_platforms.md >> release-notes.md

      - name: Артефакты
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/*
          retention-days: 30

      - name: Заметки (артефакт)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30

      - name: Сводка
        run: |
          {
            echo "### Релиз ${RELEASE_TAG}"
            echo ""
            echo "- Версия: \`${{ steps.version.outputs.value }}\`"
            echo "- Pre-release: ${{ steps.version.outputs.prerelease }}"
            echo "- Артефакты: wheel, sdist, .deb, .pyz, SHA256SUMS"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 2. Портативный exe для Windows (PyInstaller, без установки)
  # ------------------------------------------------------------------
  build-windows-exe:
    name: "Портативный exe (Windows)"
    needs: build-python
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Сборка exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          pyinstaller --noconfirm --clean --onefile --name tspu-monitor `
            --add-data "src/tspu_monitor/templates;tspu_monitor/templates" `
            packaging/windows_entry.py
          $version = "${{ needs.build-python.outputs.version }}"
          Move-Item dist/tspu-monitor.exe "dist/tspu-monitor-$version-windows-x64.exe"

      - name: Проверка запуска
        shell: pwsh
        env:
          TSPU_MENU: "0"
        run: |
          $exe = "dist/tspu-monitor-${{ needs.build-python.outputs.version }}-windows-x64.exe"
          & $exe version
          & $exe --help | Select-String "check"

      - name: Артефакты
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-exe
          path: dist/*windows-x64.exe
          retention-days: 30

  # ------------------------------------------------------------------
  # 3. GitHub Release с вложениями и телом из CHANGELOG
  # ------------------------------------------------------------------
  github-release:
    name: "GitHub Release"
    needs: [build-python, build-windows-exe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: .

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-exe
          path: dist

      - name: Имена установщиков по ОС
        run: |
          cp install.sh  install-linux-macos.sh
          cp install.ps1 install-windows.ps1
          cp install.cmd install-windows.cmd
          ls -la install-*

      - name: Контрольная сумма exe
        run: |
          cd dist
          sha256sum *windows-x64.exe >> SHA256SUMS
          tail -3 SHA256SUMS

      - name: Публикация релиза
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          prerelease: ${{ needs.build-python.outputs.prerelease == 'true' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.pyz
            dist/*windows-x64.exe
            dist/SHA256SUMS
            install-linux-macos.sh
            install-windows.ps1
            install-windows.cmd

  # ------------------------------------------------------------------
  # 4. Мультиархитектурный Docker-образ в GHCR
  # ------------------------------------------------------------------
  publish-image:
    name: "Docker image (GHCR)"
    needs: build-python
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Теги образа
        id: tags
        run: |
          VERSION="${{ needs.build-python.outputs.version }}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
          IMAGE="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [[ "$VERSION" != *-* ]]; then
              echo "${IMAGE}:${MAJOR_MINOR}"
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Вход в GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Сводка
        run: |
          {
            echo "### Docker-образ"
            echo ""
            echo "Платформы: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "Теги:"
            echo '${{ steps.tags.outputs.tags }}' | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
