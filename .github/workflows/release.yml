name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------
  # 1. Python-артефакты: sdist + wheel + контрольные суммы
  # ------------------------------------------------------------------
  build-python:
    name: "Python packages"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Сборка sdist и wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Артефакты
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          retention-days: 30

  # ------------------------------------------------------------------
  # 2. GitHub Release с вложениями
  # ------------------------------------------------------------------
  github-release:
    name: "GitHub Release"
    needs: build-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            Артефакты: wheel и sdist во вложениях, контрольные суммы — SHA256SUMS.
            Docker-образ: `ghcr.io/fairen8/tspu-monitor:${{ github.ref_name }}`.
            Изменения: см. CHANGELOG.md.

  # ------------------------------------------------------------------
  # 3. Docker-образ в GHCR
  # ------------------------------------------------------------------
  publish-image:
    name: "Docker image (GHCR)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      - name: Вход в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
