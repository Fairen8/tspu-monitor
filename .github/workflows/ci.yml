name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка
        run: pip install -e ".[dev]"

      - name: Проверка стиля (ruff)
        run: ruff check src tests scripts

      - name: Синтаксис shell-скриптов
        run: |
          bash -n install.sh scripts/*.sh \
            deploy/docker/entrypoint.sh deploy/lxc/proxmox-create.sh

      - name: ShellCheck
        run: |
          pip install --quiet shellcheck-py
          shellcheck -S warning install.sh scripts/*.sh

  tests:
    name: "Tests ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка
        run: pip install -e ".[dev]"

      - name: Тесты
        run: pytest -q --junitxml=test-results.xml

      - name: Сводка результатов
        if: always()
        run: python scripts/pytest_summary.py test-results.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт результатов
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 7

  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Сборка образа
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: tspu-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-тест
        run: docker run --rm tspu-monitor:ci version

      - name: Сводка
        run: |
          SIZE="$(docker image inspect tspu-monitor:ci --format '{{.Size}}' | awk '{printf "%.0f", $1/1024/1024}')"
          {
            echo "### Docker-образ"
            echo ""
            echo "- Размер: ${SIZE} МБ"
            echo "- Smoke-тест \`tspu-monitor version\`: OK"
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: "Secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-linux:
    name: "Install (Debian)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установка на чистом Debian 12
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12 bash -c '
            set -e
            bash install.sh --no-service
            tspu-monitor version
            tspu-monitor self-test --json >/dev/null || true
          '

  install-windows:
    name: "Install (Windows)"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Установка (файлом)
        shell: powershell
        run: |
          .\install.ps1 -Prefix "$env:RUNNER_TEMP\tspu" -Version main
          & "$env:RUNNER_TEMP\tspu\bin\tspu-monitor.cmd" version

      - name: Установка (irm | iex)
        shell: powershell
        env:
          TSPU_PREFIX: ${{ runner.temp }}\tspu-iex
          TSPU_SRC: ${{ github.workspace }}
          TSPU_NO_TELEMETRY: "1"
        run: |
          iex (Get-Content -Raw .\install.ps1)
          & "$env:TSPU_PREFIX\bin\tspu-monitor.cmd" version
