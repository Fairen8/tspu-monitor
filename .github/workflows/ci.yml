name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер (ruff)
        run: ruff check src tests

      - name: Тесты (pytest)
        run: pytest -q

  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Сборка образа
        run: docker build -t tspu-monitor:ci .

      - name: Smoke-тест образа
        run: docker run --rm tspu-monitor:ci version

  secret-scan:
    name: "Secret scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
