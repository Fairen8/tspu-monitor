name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: "Проверка зависимостей"
    # Dependency Review для приватных репозиториев требует GitHub Advanced Security.
    # Включите переменную репозитория ENABLE_DEPENDENCY_REVIEW=true при наличии GHAS.
    if: ${{ !github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
