name: Баг-репорт
description: Сообщить о воспроизводимой ошибке
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Перед созданием issue проверьте, что проблема не в сетевой
        фильтрации провайдера. Уязвимости — только через Security
        Advisories, не публично.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Вывод `tspu-monitor version`
      placeholder: "TSPU Monitor 2.0.0"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Способ развёртывания
      options:
        - Docker / docker compose
        - LXC (Proxmox)
        - VM / bare-metal (systemd)
        - Запуск из исходников
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС и Python
      placeholder: "Debian 12, Python 3.11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. tspu-monitor check web --samples 1
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: "`tspu-monitor logs -n 100 --file probes.log` (без секретов!)"
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Подтверждения
      options:
        - label: Секретов и реальных IP в тексте нет
          required: true
        - label: Это не вопрос об уязвимости (иначе — Security → Report a vulnerability)
          required: true
