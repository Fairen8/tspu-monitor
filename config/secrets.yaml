# =====================================================================
# TSPU Monitor 2 — секреты
# =====================================================================
# Шаблон. Файл на сервере: chmod 600, никогда не коммитить реальные
# значения. Заполните:
#   sudoedit /etc/tspu-monitor/secrets.yaml              (Docker)
#   sudoedit /opt/tspu-monitor/config/secrets.yaml       (LXC/bare-metal)
# =====================================================================

# ---------------------------------------------------------------------
# Telegram-бот (опционально).
#
# ВАЖНО: Bot API может быть заблокирован DPI. Прокси/zapret применяется
# ТОЛЬКО к запросам Telegram; сетевые пробы всегда идут напрямую.
#
# Варианты:
#   1) zapret на хосте/роутере — тогда proxy: null;
#   2) HTTP/SOCKS5-прокси: proxy: "socks5://127.0.0.1:1080"
#      (для SOCKS5 установите: pip install "tspu-monitor[socks]").
# ---------------------------------------------------------------------
telegram:
  enabled: false
  bot_token: ""              # токен от @BotFather
  allowed_users: []          # ваши Telegram user ID (числа)
  report_chat_id: null       # куда слать отчёты (по умолчанию — первый из allowed_users)
  proxy: null                # http://host:port | socks5://host:port | null
  api_base: "https://api.telegram.org"

# Токен для webhook (уйдёт в заголовке Authorization: Bearer <token>)
webhook:
  token: null

# Токен веб-дашборда (обязателен, если web.host не loopback)
web:
  token: null

# ---------------------------------------------------------------------
# Целевые серверы и сервисы.
# Пустая строка = сценарий пропускается.
# ---------------------------------------------------------------------
targets:
  # WireGuard
  wireguard_server: ""
  wireguard_port: 51820

  # AmneziaWG
  amnezia_server: ""
  amnezia_port: 51820

  # OpenVPN
  openvpn_server: ""
  openvpn_port: 1194

  # Shadowsocks / Outline
  shadowsocks_server: ""
  shadowsocks_port: 8388

  # XRay / VLESS Reality
  xray_server: ""
  xray_port: 443
  xray_reality_sni: "www.microsoft.com"
